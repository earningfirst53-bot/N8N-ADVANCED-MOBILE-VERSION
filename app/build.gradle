plugins { id 'com.android.application' }

android {
    namespace 'com.naten.advancedmobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.naten.advancedmobile.v6'
        minSdk 23
        targetSdk 29
        versionCode 6
        versionName '0.6.0'
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
