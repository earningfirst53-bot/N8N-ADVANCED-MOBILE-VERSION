plugins { id 'com.android.application' }

android {
    namespace 'com.naten.advancedmobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.naten.advancedmobile.v4'
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName '0.4.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
