plugins { id 'com.android.application' }

android {
    namespace 'com.naten.advancedmobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.naten.advancedmobile'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
