name: Build N8N Advanced Mobile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Render and build pass 1
        run: gradle clean assembleDebug --stacktrace

      - name: Render and build passes 2-10
        shell: bash
        run: |
          set -e
          for i in 2 3 4 5 6 7 8 9 10; do
            echo "=== BUILD PASS $i ==="
            gradle assembleDebug
          done

      - name: Verify APK archive
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          echo "APK bytes: $(stat -c%s app/build/outputs/apk/debug/app-debug.apk)"

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect APK package
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -20

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: N8N-Advanced-Mobile-v0.4.0
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
