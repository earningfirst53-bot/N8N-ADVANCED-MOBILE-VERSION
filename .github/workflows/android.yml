name: Build N8N Advanced Mobile v1.4.0

on:
  push:
    branches: [ v1.4-install-compat ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle clean assembleRelease
      - name: Sign
        run: keytool -genkeypair -v -keystore ci-release.keystore -storepass n8n-mobile-ci-only -keypass n8n-mobile-ci-only -alias n8nmobile -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=N8N Advanced Mobile, O=N8N Prototype, C=IN"
      - name: Align
        run: "$ANDROID_HOME/build-tools/35.0.0/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk"
      - name: APK sign
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks ci-release.keystore --ks-key-alias n8nmobile --ks-pass pass:n8n-mobile-ci-only --min-sdk-version 23 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out N8N-Advanced-Mobile-v1.4.0.apk app-release-aligned.apk"
      - name: Verify
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose N8N-Advanced-Mobile-v1.4.0.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: N8N-Advanced-Mobile-v1.4.0
          path: N8N-Advanced-Mobile-v1.4.0.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33, 34, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: N8N-Advanced-Mobile-v1.4.0
          path: apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -e
            adb wait-for-device
            for i in $(seq 1 10); do
              adb uninstall com.naten.advancedmobile.v14 >/dev/null 2>&1 || true
              adb install --no-incremental apk/N8N-Advanced-Mobile-v1.4.0.apk
              adb shell pm path com.naten.advancedmobile.v14
              adb shell monkey -p com.naten.advancedmobile.v14 1 >/dev/null
              adb shell am force-stop com.naten.advancedmobile.v14
            done
