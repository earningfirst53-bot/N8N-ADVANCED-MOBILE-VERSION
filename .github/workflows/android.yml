name: Build N8N Advanced Mobile

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Render/build pass 1
        run: gradle --no-daemon clean assembleDebug

      - name: Render/build passes 2-5
        run: |
          for i in 2 3 4 5; do
            echo "=== Build validation pass $i ==="
            gradle --no-daemon assembleDebug
          done

      - name: Verify APK structure and signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          echo "APK size:"
          stat -c%s app/build/outputs/apk/debug/app-debug.apk

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.naten.advancedmobile.v3/.MainActivity
            sleep 4
            adb shell pidof com.naten.advancedmobile.v3
            adb shell dumpsys package com.naten.advancedmobile.v3 | grep -E "versionCode=3|versionName=0.3.0"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: N8N-Advanced-Mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package source
        run: git archive --format=zip --output=N8N-Advanced-Mobile-source.zip HEAD

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: N8N-Advanced-Mobile-source
          path: N8N-Advanced-Mobile-source.zip
          if-no-files-found: error
